[package]
name = "lai"
version = "0.1.0"
edition = "2024"

[dependencies]
anyhow = "1"
clap = { version = "4.5", features = ["derive"] }
console = "0.16.6"
ctrlc = { version = "3.5", features = ["termination"] }
pdf-extract = "0.12.1"
reqwest = {
    version = "0.13.5",
    default-features = false,
    features = ["blocking", "json"]
}
serde_json = "1"
tempfile = "3"

